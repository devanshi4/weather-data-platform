version: 2

models:
  - name: dim_city
    columns:
      - name: city
        tests:
          - not_null
          - unique

  - name: dim_date
    columns:
      - name: date_day
        tests:
          - not_null
          - unique

  - name: fct_weather_hourly
    columns:
      - name: weather_key
        tests:
          - not_null
          - unique
      - name: city
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_city')
                field: city
      - name: temperature_c
        tests:
          - not_null